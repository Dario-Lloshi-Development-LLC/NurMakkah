name: CI/CD - Android Rename Preview

on:
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/**'
  push:
    branches:
      - feature/android-rename
    paths:
      - 'android/**'
      - '.github/workflows/**'

env:
  JAVA_VERSION: '17'
  ANDROID_API_LEVEL: '34'

jobs:
  android-preview-build:
    name: Android Preview Build (unsigned)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            android/.gradle/caches
            android/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-rename-preview-${{ hashFiles('android/**/build.gradle*', 'android/**/gradle-wrapper.properties') }}

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (unsigned)
        working-directory: ./android
        run: ./gradlew assembleRelease --no-daemon --stacktrace || echo "assembleRelease failed (expected without keystore)"

      - name: Build Release AAB (unsigned)
        working-directory: ./android
        run: ./gradlew bundleRelease --no-daemon --stacktrace || echo "bundleRelease failed (expected without keystore)"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v3
        with:
          name: android-rename-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload any built release artifacts
        uses: actions/upload-artifact@v3
        with:
          name: android-rename-release-artifacts
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Note about signing
        run: |
          echo "This preview build runs without a release keystore."
          echo "To produce signed artifacts, add secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD and enable the decode step in the full CI."
